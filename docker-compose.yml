services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: t-bot
    restart: unless-stopped
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      # Web UI / REST API, bound to localhost only
      - "127.0.0.1:8080:8080"
    # Default command = live PAPER trading (dry-run). The strategy + config
    # both set dry_run:true, so no real orders are ever sent.
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite
      --config /freqtrade/user_data/config.json
      --strategy MomentumStrategy
